# ===================================================================
# MENUMIND AI - APPLICATION CONFIGURATION
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# Notice: 'createDatabaseIfNotExist=true' automatically creates 'menumind_db' if it does not exist!


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000&autoReconnect=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Resilience & Keepalive
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1800000

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
# 'update': automatically updates table schemas matching JPA entities without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# JWT (JSON Web Token) Security Configuration
# -------------------------------------------------------------------
# 256-bit Base64/HMAC secret key used for cryptographically signing JWT tokens
menumind.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token validity duration in milliseconds (86,400,000 ms = 24 hours)
menumind.jwt.expiration-ms=86400000
